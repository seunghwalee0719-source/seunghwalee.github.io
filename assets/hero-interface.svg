<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Abstract electrochemical interface</title><desc id="d">A stylized electrode surface with molecular spheres, gas bubbles, and operando spectroscopy traces.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#06182b"/><stop offset="0.48" stop-color="#073557"/><stop offset="1" stop-color="#0b5b78"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#71f7ff" stop-opacity=".58"/><stop offset=".5" stop-color="#30bad0" stop-opacity=".2"/><stop offset="1" stop-color="#07192a" stop-opacity="0"/></radialGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c5e9f4"/><stop offset=".25" stop-color="#4c7d91"/><stop offset=".55" stop-color="#132b3c"/><stop offset=".8" stop-color="#7fc3d5"/><stop offset="1" stop-color="#1a3448"/></linearGradient>
  <linearGradient id="spec" x1="0" x2="1"><stop stop-color="#3fe1ff" stop-opacity=".1"/><stop offset=".45" stop-color="#6ef7ff"/><stop offset="1" stop-color="#9dffff" stop-opacity=".2"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<ellipse cx="1080" cy="310" rx="650" ry="370" fill="url(#glow)"/>
<g opacity=".18" fill="#7beeff">
  <circle cx="590" cy="160" r="7"/><circle cx="710" cy="260" r="5"/><circle cx="830" cy="120" r="9"/><circle cx="1240" cy="150" r="6"/><circle cx="1460" cy="220" r="10"/><circle cx="1330" cy="360" r="5"/><circle cx="1000" cy="210" r="6"/>
</g>
<!-- spectroscopy trace -->
<polyline points="650,560 700,560 725,558 745,548 760,560 805,560 835,552 855,490 875,560 930,560 960,548 978,430 990,560 1040,560 1080,540 1100,330 1115,560 1170,560 1200,548 1220,170 1235,560 1280,560 1320,550 1342,390 1360,560 1410,560 1445,530 1470,260 1490,560" fill="none" stroke="url(#spec)" stroke-width="5" opacity=".95"/>
<polyline points="650,575 700,575 745,565 760,575 850,575 875,570 900,575 990,575 1020,568 1040,520 1060,575 1160,575 1180,567 1198,500 1212,575 1320,575 1340,568 1360,540 1374,575 1510,575" fill="none" stroke="#44d8ff" stroke-width="2" opacity=".45"/>
<!-- electrode lattice -->
<g transform="translate(560 540) skewX(-18)">
  <g fill="url(#metal)" stroke="#9ed8e8" stroke-opacity=".25" stroke-width="2">
    <path d="M0 80 L80 10 160 80 80 150Z"/><path d="M160 80 L240 10 320 80 240 150Z"/><path d="M320 80 L400 10 480 80 400 150Z"/><path d="M480 80 L560 10 640 80 560 150Z"/><path d="M640 80 L720 10 800 80 720 150Z"/><path d="M800 80 L880 10 960 80 880 150Z"/>
    <path d="M80 150 L160 80 240 150 160 220Z"/><path d="M240 150 L320 80 400 150 320 220Z"/><path d="M400 150 L480 80 560 150 480 220Z"/><path d="M560 150 L640 80 720 150 640 220Z"/><path d="M720 150 L800 80 880 150 800 220Z"/>
    <path d="M160 220 L240 150 320 220 240 290Z"/><path d="M320 220 L400 150 480 220 400 290Z"/><path d="M480 220 L560 150 640 220 560 290Z"/><path d="M640 220 L720 150 800 220 720 290Z"/>
  </g>
</g>
<!-- surface atoms -->
<g fill="#173a52" stroke="#78cfe1" stroke-width="2">
  <circle cx="650" cy="650" r="28"/><circle cx="760" cy="610" r="22"/><circle cx="860" cy="648" r="30"/><circle cx="965" cy="605" r="24"/><circle cx="1070" cy="648" r="32"/><circle cx="1180" cy="605" r="25"/><circle cx="1285" cy="648" r="31"/><circle cx="1390" cy="602" r="24"/><circle cx="1490" cy="650" r="32"/>
  <circle cx="810" cy="700" r="20"/><circle cx="1010" cy="714" r="22"/><circle cx="1225" cy="708" r="22"/><circle cx="1430" cy="720" r="21"/>
</g>
<g fill="#bffcff" opacity=".35"><circle cx="642" cy="640" r="8"/><circle cx="854" cy="637" r="9"/><circle cx="1060" cy="636" r="10"/><circle cx="1277" cy="637" r="9"/><circle cx="1480" cy="638" r="10"/></g>
<!-- bubbles -->
<g fill="#b7faff" fill-opacity=".08" stroke="#c9ffff" stroke-opacity=".86" stroke-width="3">
  <circle cx="1020" cy="435" r="34"/><circle cx="1090" cy="350" r="19"/><circle cx="1135" cy="276" r="28"/><circle cx="1178" cy="210" r="15"/><circle cx="1260" cy="405" r="22"/><circle cx="1320" cy="330" r="12"/><circle cx="1425" cy="460" r="27"/><circle cx="1510" cy="360" r="17"/><circle cx="935" cy="512" r="17"/>
</g>
<g fill="#e7ffff" opacity=".5"><circle cx="1007" cy="423" r="7"/><circle cx="1125" cy="263" r="6"/><circle cx="1254" cy="397" r="5"/><circle cx="1415" cy="449" r="6"/></g>
<path d="M530,100 C820,40 980,130 1190,78 S1510,34 1600,120" fill="none" stroke="#39b9d0" stroke-opacity=".13" stroke-width="70" filter="url(#soft)"/>
<rect width="760" height="900" fill="url(#bg)" opacity=".78"/>
<rect x="620" width="420" height="900" fill="url(#bg)" opacity=".28"/>
</svg>
